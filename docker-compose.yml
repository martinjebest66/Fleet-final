version: "3.8"

services:
  mongodb:
    image: mongo:7
    container_name: fleet-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet-app
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGO_URL: "mongodb://mongodb:27017"
      DB_NAME: "fleet_manager"
      JWT_SECRET: "${JWT_SECRET:-changeme-use-random-64-chars}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@autoskola.cz}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin123!}"
      CORS_ORIGINS: "*"
    ports:
      - "80:80"     # Web (Nginx -> frontend + API)
      - "5027:5027" # Teltonika GPS tracker TCP

volumes:
  mongo_data:
