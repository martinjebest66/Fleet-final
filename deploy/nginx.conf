# Fleet Manager — single-origin reverse proxy.
#
# The React build and the API are served from the same origin, so the browser
# sends first-party cookies and CORS is not involved at all. Keep it that way:
# splitting the frontend onto another origin means reconfiguring cookies
# (SameSite=None + Secure) and CORS on the backend as well.

upstream fleet_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

# Trust the proxy scheme when this container itself sits behind a TLS
# terminator, otherwise fall back to the scheme of the incoming request.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Uploaded photos are inlined as base64, so request bodies get large.
    client_max_body_size 32M;
    client_body_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    server_tokens off;

    # Health endpoint for container/monitoring probes.
    location = /healthz {
        proxy_pass http://fleet_backend/api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # API proxy -> FastAPI backend.
    # `location /api` (no trailing slash) also matches a bare `/api` request,
    # which the previous `/api/`-only rule handed to the SPA fallback instead.
    location /api {
        proxy_pass http://fleet_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Reports and imports over a long period legitimately take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Hashed build assets are immutable and safe to cache aggressively.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on the old
    # bundle while the API has already moved on.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # SPA fallback — every other path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
